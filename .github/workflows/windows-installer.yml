# Windows instalátor: build_exe.bat (PyInstaller) → kontrola exe → Inno Setup → kontrola instalace → GitHub Release.
# Spouští se ručně (Actions → Windows installer → Run workflow) nebo tagem v* (git tag v1.5 && git push --tags).
# Instalátor se nenahrává jako artefakt (1 GB by přetekl limit úložiště Actions), jde rovnou do Release.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the installer as a GitHub release (yes / no)"
        default: "yes"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version from the file name
        id: ver
        shell: pwsh
        run: |
          $f = Get-ChildItem localchef_studio_v*.py | Sort-Object { [version]($_.BaseName -replace '^localchef_studio_v','') } | Select-Object -Last 1
          $v = $f.BaseName -replace '^localchef_studio_v',''
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "App file: $($f.Name), version $v"

      - name: PyQt6 in the global Python (build_exe.bat builds with the same version)
        run: python -m pip install PyQt6 PyQt6-WebEngine

      - name: Build the program (build_exe.bat)
        shell: cmd
        run: call build_exe.bat

      - name: Smoke test of LocalChefStudio.exe
        shell: pwsh
        run: |
          $exe = "dist\LocalChefStudio\LocalChefStudio.exe"
          if (-not (Test-Path $exe)) { throw "LocalChefStudio.exe missing" }
          "{0:N0} MB" -f ((Get-ChildItem dist\LocalChefStudio -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          $p = Start-Process $exe -WorkingDirectory dist\LocalChefStudio -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 3
            try { $r = Invoke-WebRequest http://127.0.0.1:3665/api/recipes -UseBasicParsing -TimeoutSec 5; $ok = $true; Write-Host $r.Content; break } catch {}
            if ($p.HasExited) { break }
          }
          if (Test-Path dist\LocalChefStudio\localchef_data\app.log) { Get-Content dist\LocalChefStudio\localchef_data\app.log -Tail 40 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Process QtWebEngineProcess -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Remove-Item dist\LocalChefStudio\localchef_data -Recurse -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The program did not start (phone server on port 3665 did not answer)" }

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\localchef_studio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist_installer | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB)}}

      - name: Test install and uninstall
        shell: pwsh
        run: |
          $setup = "dist_installer\LocalChef_Studio_${{ steps.ver.outputs.version }}.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\LocalChef Studio"
          if (-not (Test-Path "$dir\LocalChefStudio.exe")) { throw "Not installed into $dir" }
          Write-Host "Installed to $dir"
          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          Start-Process $unins.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 5
          if (Test-Path "$dir\LocalChefStudio.exe") { throw "Uninstall left the program behind" }
          Write-Host "Uninstalled"

      - name: Publish the GitHub release
        if: github.event_name == 'push' || github.event.inputs.publish == 'yes'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          (Get-Content installer\release_notes.md -Raw).Replace('{version}', $v) | Set-Content notes.md -Encoding utf8
          $file = "dist_installer\LocalChef_Studio_$v.exe"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag $file --title "LocalChef Studio $v" --notes-file notes.md --target $env:GITHUB_SHA
          }
